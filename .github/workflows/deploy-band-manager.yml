name: Deploy Band Manager

on:
  push:
    branches:
      - main
    paths:
      - "GUTDManager/supabase/config.toml"
      - "GUTDManager/supabase/functions/band-manager/**"
      - "GUTDManager/supabase/functions/push-notifications/**"
      - ".github/workflows/deploy-band-manager.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: 3.4.0

      - name: Deploy Band Manager function
        working-directory: GUTDManager
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy band-manager --remote=pibgazoibrdhwnotdazd --yes

      - name: Deploy push notifications function
        working-directory: GUTDManager
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: supabase functions deploy push-notifications --remote=pibgazoibrdhwnotdazd --yes
